<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Childress Painting">
  <!-- CP monogram, simplified from the official mark for favicon sizes.
       Black C, red P, angled to match the italic lockup. -->
  <rect width="64" height="64" fill="#0a0a0b"/>

  <!-- C: open ring, cut on the right -->
  <path
    d="M34 13
       A17 17 0 1 0 34 51
       L34 42
       A8.5 8.5 0 1 1 34 22
       Z"
    fill="#ffffff"
    transform="rotate(-8 32 32)"
  />

  <!-- P: stem plus bowl -->
  <g fill="#d81f26" transform="rotate(-8 32 32)">
    <rect x="34" y="13" width="9.5" height="38"/>
    <path d="M43.5 13 H50 a11 11 0 0 1 0 22 H43.5 v-8.5 H50 a2.5 2.5 0 0 0 0-5 H43.5 Z"/>
  </g>

  <!-- Brush stroke accent -->
  <path d="M8 47 q12 5 26 1 l-2 6 q-13 3 -24 -2 Z" fill="#d81f26" opacity="0.9"/>
</svg>
